<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ガチャ問題</title>

<style>
  body {
  font-family: "Roboto", "Noto Sans JP", sans-serif;
  background: linear-gradient(135deg, #ff9a9e, #fad0c4);
  padding: 20px;
  }

  /* カード（ガチャカプセル風） */
  .card {
    background: white;
    padding: 24px;
    margin: 20px auto;
    border-radius: 20px;
    max-width: 720px;
    box-shadow: 0 6px 12px rgba(0,0,0,0.15);
    border: 3px solid #ff6f61;
  }

  /* タイトル */
  h2 {
    font-size: 24px;
    font-weight: 700;
    color: #ff4f4f;
    margin-bottom: 12px;
  }

  /* 説明文 */
  p {
    color: #5f6368;
    margin-bottom: 16px;
    font-size: 16px;
  }

  /* 入力欄（カプセル風） */
  input {
    width: 100%;
    padding: 14px;
    margin: 10px 0 20px 0;
    border: 2px solid #ff6f61;
    border-radius: 50px;
    font-size: 16px;
    box-sizing: border-box;
    background: #fff7f7;
  }

  input:focus {
    outline: none;
    border-color: #ff3b3b;
    box-shadow: 0 0 0 2px #ffb3b3;
  }

  /* ボタン（ガチャボタン風） */
  button {
    background: #ff4f4f;
    color: white;
    border: none;
    padding: 14px 24px;
    font-size: 18px;
    border-radius: 50px;
    cursor: pointer;
    margin-top: 10px;
    box-shadow: 0 4px 8px rgba(255,0,0,0.3);
    transition: transform 0.1s ease;
  }

  button:hover {
    background: #ff2f2f;
    transform: scale(1.05);
  }

  /* 画面切り替え */
  .screen { display: none; }
  .active { display: block; }

  /* 問題画像 */
  #questionArea img {
    max-width: 100%;
    border-radius: 12px;
    margin-bottom: 20px;
    border: 3px solid #ff6f61;
  }

  /* ガチャローディングアニメーション */
  #loadingSpinner {
    width: 120px;
    height: 120px;
    margin: 20px auto;
    border-radius: 50%;
    border: 12px solid #ffd1d1;
    border-top-color: #ff4f4f;
    animation: spin 1s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

</style>
</head>
<body>

<!-- ① 問題認証画面 -->
<div id="screen1" class="screen active card">
  <h2>問題認証中…</h2>
  <div id="loadingSpinner"></div>
  <p>ガチャを回しています…</p>

</div>

<!-- ② 参加者認証画面 -->
<div id="screen2" class="screen card">
  <h2>参加者認証</h2>

  <label>参加者ID</label>
  <input type="text" id="participantId">

  <label>ニックネーム</label>
  <input type="text" id="nickname">

  <button onclick="verifyParticipant()">次へ</button>
</div>

<!-- ③ 問題＋回答画面 -->
<div id="screen3" class="screen card">
  <h2 id="questionNo">問題</h2>
  <p>空欄に当てはまる数字を入力してください。</p>

  <div id="questionArea"></div>

  <button onclick="submitAnswers()">回答を送信する</button>
</div>

<!-- ④ 送信完了画面 -->
<div id="screen4" class="screen card">
  <h2>送信が完了しました</h2>
  <p>回答を受け付けました。ありがとうございました。</p>

  <p id="resultText" style="font-size:18px; font-weight:500; color:#3c4043;"></p>
</div>


<script>
// ------------------------------
// 認証状態と認証情報の保持
// ------------------------------
let verifiedQuestion = false;
let verifiedParticipant = false;

let savedFormId = null;
let savedFormPw = null;
let savedParticipantId = null;
let savedNickname = null;

let questionToken = null;
let participantToken = null;


// ------------------------------
// 画面遷移
// ------------------------------
function showScreen(n) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById("screen" + n).classList.add("active");
}
function goToScreen2() { showScreen(2); }
function goToScreen3() { showScreen(3); }
function goToScreen4() { showScreen(4); }


// ------------------------------
// ① QRコード情報の読み込み → 問題認証
// ------------------------------
const url = new URL(location.href);
const api = url.searchParams.get("api");
const id  = url.searchParams.get("id");
const pw  = url.searchParams.get("pw");

savedFormId = id;
savedFormPw = pw;

async function verifyQuestion() {
  document.getElementById("loadingSpinner").style.display = "block";

  try {
    const verifyUrl = `${api}?mode=verifyQuestion&id=${encodeURIComponent(id)}&pw=${encodeURIComponent(pw)}`;
    const res = await fetch(verifyUrl);
    const data = await res.json();

    if (data.status === "OK") {
      verifiedQuestion = true;
      questionToken = data.token;

      await loadQuestionHtml();

      // ローディング非表示
      document.getElementById("loadingSpinner").style.display = "none";

      goToScreen2();
    } else {
      alert("問題認証に失敗しました");
    }
  } catch (error) {
    document.getElementById("loadingSpinner").style.display = "none";
    document.querySelector("#screen1 p").textContent =
      "問題認証に失敗しました。API URL、通信状態、CORS設定を確認してください。";
  }
}


verifyQuestion();


// ------------------------------
// ③ 問題HTMLを JSON で受信して表示
// ------------------------------
async function loadQuestionHtml() {
  const requestUrl = `${api}?mode=getQuestion` +
    `&tokenQuestion=${encodeURIComponent(questionToken)}` +
    `&formId=${encodeURIComponent(savedFormId)}`;

  const res = await fetch(requestUrl);
  const data = await res.json();

  if (data.status === "OK") {
    document.getElementById("questionNo").textContent = "問題No. " + id;
    document.getElementById("questionArea").innerHTML = data.html;
  } else {
    throw new Error("問題データの取得に失敗しました");
  }
}


// ------------------------------
// ② 参加者認証
// ------------------------------
async function verifyParticipant() {
  const pid = document.getElementById("participantId").value;
  const nick = document.getElementById("nickname").value;

  try {
    const verifyUrl = `${api}?mode=verifyParticipant&pid=${encodeURIComponent(pid)}&nick=${encodeURIComponent(nick)}`;
    const res = await fetch(verifyUrl);
    const data = await res.json();

    if (data.status === "OK") {
      verifiedParticipant = true;
      savedParticipantId = pid;
      savedNickname = nick;
      participantToken = data.token;

      goToScreen3();
    } else {
      alert("参加者認証に失敗しました");
    }
  } catch (error) {
    console.error("参加者認証 API エラー:", error);
  }
}


// ------------------------------
// ④ 回答保存
// ------------------------------
async function submitAnswers() {
  if (!verifiedQuestion || !verifiedParticipant) {
    alert("認証が完了していません");
    return;
  }

  const params = new URLSearchParams({
    mode: "saveAnswer",
    formId: savedFormId,
    formPw: savedFormPw,
    pid: savedParticipantId,
    nick: savedNickname,
    tokenQuestion: questionToken,
    tokenParticipant: participantToken,
  });

  for (const input of document.querySelectorAll("#screen3 input")) {
    params.set(input.id, input.value);
  }

  try {
    const res = await fetch(`${api}?${params.toString()}`);
    const data = await res.json();

    if (data.status === "OK") {
      const result = data.result;

      // ★ 送信完了画面に結果を表示
      document.getElementById("resultText").textContent =
        `獲得ポイント: ${result.earnedPoints} / ${result.totalPoints}`;

      // ★ 画面遷移
      goToScreen4();

    } else {
      alert(data.message || "回答保存に失敗しました");
    }
  } catch (error) {
    alert("回答保存中にエラーが発生しました");
  }
}


</script>

</body>
</html>
