<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ガチャ問題</title>
<style>
  body { font-family: sans-serif; padding: 20px; }
  .screen { display: none; }
  .active { display: block; }
  input { display: block; margin: 8px 0; padding: 8px; width: 100%; }
  button { padding: 12px 20px; font-size: 18px; background: #4285F4; color: white; border: none; border-radius: 6px; cursor: pointer; }
  #problemArea img { max-width: 100%; }
</style>
</head>
<body>

<!-- ① 問題認証画面 -->
<div id="screen1" class="screen active">
  <h2>問題認証中…</h2>
  <p>QRコードの情報を読み込んでいます。</p>
</div>

<!-- ② 参加者認証画面 -->
<div id="screen2" class="screen">
  <h2>参加者認証</h2>

  <label>参加者ID</label>
  <input type="text" id="participantId">

  <label>ニックネーム</label>
  <input type="text" id="nickname">

  <button onclick="verifyParticipant()">次へ</button>
</div>

<!-- ③ 問題閲覧画面 -->
<div id="screen3" class="screen">
  <h2>問題</h2>
  <div id="problemArea"></div>
  <button onclick="goToScreen4()">回答へ進む</button>
</div>

<!-- ④ 回答画面 -->
<div id="screen4" class="screen">
  <h2>回答入力</h2>

  <h3>問題 1</h3>
  <input type="text" id="q1_1" placeholder="回答1">
  <input type="text" id="q1_2" placeholder="回答2">
  <input type="text" id="q1_3" placeholder="回答3">
  <input type="text" id="q1_4" placeholder="回答4">
  <input type="text" id="q1_5" placeholder="回答5">
  <input type="text" id="q1_6" placeholder="回答6">

  <h3>問題 2</h3>
  <input type="text" id="q2_1" placeholder="回答1">
  <input type="text" id="q2_2" placeholder="回答2">
  <input type="text" id="q2_3" placeholder="回答3">
  <input type="text" id="q2_4" placeholder="回答4">
  <input type="text" id="q2_5" placeholder="回答5">
  <input type="text" id="q2_6" placeholder="回答6">

  <button onclick="submitAnswers()">回答を送信する</button>
</div>

<script>
// ------------------------------
// 認証状態と認証情報の保持
// ------------------------------
let verifiedProblem = false;
let verifiedParticipant = false;

let savedFormId = null;
let savedFormPw = null;
let savedParticipantId = null;
let savedNickname = null;

let problemToken = null;
let participantToken = null;


// ------------------------------
// 画面遷移
// ------------------------------
function showScreen(n) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById("screen" + n).classList.add("active");
}
function goToScreen2() { showScreen(2); }
function goToScreen3() { showScreen(3); }
function goToScreen4() { showScreen(4); }


// ------------------------------
// ① QRコード情報の読み込み → 問題認証
// ------------------------------
const url = new URL(location.href);
const api = url.searchParams.get("api");
const id  = url.searchParams.get("id");
const pw  = url.searchParams.get("pw");

savedFormId = id;
savedFormPw = pw;

async function verifyProblem() {
  try {
    const verifyUrl = `${api}?mode=verifyProblem&id=${encodeURIComponent(id)}&pw=${encodeURIComponent(pw)}`;
    const res = await fetch(verifyUrl);
    const data = await res.json();   // ← JSON に変更

    if (data.status === "OK") {
      verifiedProblem = true;
      problemToken = data.token;

      await loadProblemHtml();  // トークン付き getProblem 呼び出し

      goToScreen2();
    } else {
      alert("問題認証に失敗しました");
    }
  } catch (error) {
    console.error("問題認証 API エラー:", error);
    document.querySelector("#screen1 h2").textContent = "問題認証に失敗しました";
    document.querySelector("#screen1 p").textContent = "認証サーバーが JSON を返しませんでした。管理者に連絡してください。";
  }
}

// ページ読み込み時に問題認証を実行
verifyProblem();


// ------------------------------
// ③ 問題HTMLを JSON で受信して表示
// ------------------------------
async function loadProblemHtml() {
  const requestUrl = `${api}?mode=getProblem&tokenProblem=${encodeURIComponent(problemToken)}`;
  const res = await fetch(requestUrl);
  const data = await res.json();

  if (data.status === "OK") {
    document.getElementById("problemArea").innerHTML = data.html;
  } else {
    throw new Error("問題データの取得に失敗しました");
  }
}


// ------------------------------
// ② 参加者認証
// ------------------------------
async function verifyParticipant() {
  const pid = document.getElementById("participantId").value;
  const nick = document.getElementById("nickname").value;

  try {
    const verifyUrl = `${api}?mode=verifyParticipant&pid=${encodeURIComponent(pid)}&nick=${encodeURIComponent(nick)}`;
    const res = await fetch(verifyUrl);
    const data = await res.json();

    if (data.status === "OK") {
      verifiedParticipant = true;
      savedParticipantId = pid;
      savedNickname = nick;
      participantToken = data.token;

      goToScreen3();
    } else {
      alert("参加者認証に失敗しました");
    }
  } catch (error) {
    console.error("参加者認証 API エラー:", error);
    alert("参加者認証サーバーとの通信に失敗しました");
  }
}


// ------------------------------
// ④ 回答保存（Apps Script → Google Sheets）
// ------------------------------
async function submitAnswers() {
  if (!verifiedProblem || !verifiedParticipant) {
    alert("認証が完了していません");
    return;
  }

  const params = new URLSearchParams({
    mode: "saveAnswer",
    formId: savedFormId,
    formPw: savedFormPw,
    pid: savedParticipantId,
    nick: savedNickname,
    tokenProblem: problemToken,
    tokenParticipant: participantToken
  });

  for (const input of document.querySelectorAll("#screen4 input")) {
    params.set(input.id, input.value);
  }

  try {
    const res = await fetch(`${api}?${params.toString()}`);
    const data = await res.json();

    if (data.status === "OK") {
      alert("回答を保存しました！");
    } else {
      alert("回答保存に失敗しました");
    }
  } catch (error) {
    console.error("回答保存 API エラー:", error);
    alert("回答保存サーバーとの通信に失敗しました");
  }
}
</script>

</body>
</html>
