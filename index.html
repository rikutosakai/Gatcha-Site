<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ガチャ問題</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #f5f5f5;
    }
    iframe {
      border: none;
      width: 100%;
      height: 100vh;
    }
  </style>
</head>
<body>
  <iframe id="problemFrame"></iframe>

  <script>
    const url = new URL(location.href);

    // QRコードに埋め込まれた Apps Script の URL
    const api = url.searchParams.get("api");

    // id と pw をそのまま引き継ぐ
    const id = url.searchParams.get("id");
    const pw = url.searchParams.get("pw");

    // Apps Script に渡すURLを生成
    const apiUrl = `${api}?id=${id}&pw=${pw}`;

    // iframe に読み込む（警告ヘッダーが完全に消える）
    document.getElementById("problemFrame").src = apiUrl;
  </script>
</body>
</html>
